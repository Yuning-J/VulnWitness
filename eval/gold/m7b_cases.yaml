  - id: nas-threats
    split: holdout
    goal: What threats does FiGHT describe against NAS signalling between the UE and the AMF?
    request: {query: "NAS signalling attacks", scope: protocol_context_only}
    needs: [protocol_context]
    rules:
      techniques:
        relevant:
          technique_any: ["NAS", "Non-Access Stratum", "Security Mode Command"]
        required:
          technique_ids:
            ids: ["FGT5012.006", "FGT1498.503", "FGT1642.502", "FGT1642.503", "FGT5009.001", "FGT1600.501"]
            reasons:
              FGT5012.006: modified NAS signalling geolocates a UE
              FGT1498.503: crafted NAS messages crash or slow the AMF
              FGT1642.502: crafted NAS messages in the middle make a UE's registration fail
              FGT1642.503: crafted NAS messages in the middle make the AMF reject a registration
              FGT5009.001: spoofed signalling enables NULL integrity for NAS over the radio interface
              FGT1600.501: altered signalling enables NULL encryption for NAS over the radio interface
    label:
      sufficiency: sufficient
      reason: FiGHT describes NAS attacks; no reviewed topic card covers NAS.
    drafted_by: assistant
    confirmed_by: owner
    confirmed_on: 2026-10-28

