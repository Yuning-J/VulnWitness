      techniques:
        relevant:
          technique_any: ["GTP", "GTP-U", "GTP-C", "GTPv1", "GTPv2", "GPRS Tunnelling Protocol", "GPRS Tunneling Protocol"]
        required:
          technique_ids:
            ids: ["FGT1498.503", "FGT1499.504", "FGT1499.505", "FGT1572.501", "FGT1572.502", "FGT1599.505", "FGT5031", "FGT5042"]
            reasons:
              FGT1498.503: crafted GTP-U messages crash or slow the UPF
              FGT1499.504: crafted GTP-U packets over an established tunnel crash or slow a UE
              FGT1499.505: crafted GTP-U packets to the UPF make a server crash or slow a UE
              FGT1572.501: crafted GTP-U packets to the UPF/PGW-U open an illicit session with a UE
              FGT1572.502: GTP-U carries an adversary's command-and-control tunnel
              FGT1599.505: a malicious GTP-U payload evades UPF/PGW-U routing controls
              FGT5031: discovering a valid GTP-U TEID enables further attacks
              FGT5042: GTP echo requests bypass a telecom signaling firewall
