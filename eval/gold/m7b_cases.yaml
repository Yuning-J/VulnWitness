# M7b gold cases (docs/rebuild/m7b-gold-labels.md): hand-labelled questions over one corpus
# store and the full FiGHT 3.1.0 snapshot. Each case's sets are derived by its rules, never
# written by hand: `cve-kgrag eval gold-sets --gold eval/gold/m7b_cases.yaml` prints them,
# and `--check eval/gold/m7b_sets.json` compares them with the recorded file. The file holds
# queries, rules, CVE and technique IDs and labels only, never NVD or KEV text.
corpus_content_sha256: "0dc90836bb0f02f748ef0bd758909711557cb85413110c58a14d5a4d55c15f3a"
fight_snapshot_sha256: "59a9addbd75d8680091797d66d5b237d9d026512990c61a6f51692ca94d2a7a8"
cases:
  - id: open5gs-amf
    split: baseline
    goal: Which known vulnerabilities affect the AMF of Open5GS?
    request: {query: "Open5GS AMF vulnerabilities", scope: implementation_only}
    needs: [implementation_cves]
    rules:
      cves:
        relevant:
          any_of:
            - cpe: ["open5gs:open5gs"]
            - description_any: ["Open5GS"]
        required:
          all_of:
            - any_of:
                - cpe: ["open5gs:open5gs"]
                - description_any: ["Open5GS"]
            - description_any: ["AMF", "Access and Mobility Management Function"]
        irrelevant:
          all_of:
            - description_any: ["AMF", "Access and Mobility Management Function"]
            - any_of:
                - cpe_vendor: ["free5gc", "openairinterface", "magma", "linuxfoundation", "onfproject", "nextepc"]
                - description_any: ["free5GC", "OpenAirInterface", "OAI", "Magma", "SD-Core", "NextEPC"]
            - none_of:
                - cpe: ["open5gs:open5gs"]
                - description_any: ["Open5GS"]
    label:
      sufficiency: sufficient
      reason: Open5GS CVEs naming the AMF exist in the store.
    drafted_by: assistant
    confirmed_by: owner
    confirmed_on: 2026-10-27

  - id: 5g-aka-threats
    split: baseline
    goal: What threats does FiGHT describe against 5G AKA authentication?
    request: {query: "5G AKA threats", scope: protocol_context_only}
    needs: [protocol_context]
    rules:
      techniques:
        relevant:
          technique_any: ["5G AKA", "5G-AKA", "AUSF", "SEAF", "K_SEAF", "authentication vector", "SUCI", "SUPI", "UDM"]
        required:
          technique_ids:
            ids: ["FGT1499.503", "FGT5044", "FGT1036.501"]
            reasons:
              FGT1499.503: its procedures manipulate the AKA exchange through a controlled AMF/SEAF, AUSF or UDM
              FGT5044: forces the home network to derive and send a victim's keys during roaming authentication
              FGT1036.501: spoofs a PLMN ID to obtain authentication vectors from the home network
    label:
      sufficiency: sufficient
      reason: The full FiGHT snapshot holds techniques that attack the 5G AKA exchange itself.
    drafted_by: assistant
    confirmed_by: owner
    confirmed_on: 2026-10-27

