        - {cve_id: "CVE-9999-0004", tier: protocol_component_implementation}
      excluded_implementation_candidates: []
      protocol_context: []
      claims: ["cve:CVE-9999-0003", "cve:CVE-9999-0004"]
      applicability:
        - {product: "f5gc", status: unknown}
      warning_codes: [topic_pending_review, applicability_unknown]
      tool_calls: 5
      rounds: 2

  # FiGHT fails inside the one topic step; nothing retries it.
  - id: fight_unavailable_mixed
    request: {query: "5gaka", scope: mixed}
    sources: {mitre_fight: unavailable}
    expected:
      intent: topic
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_source_failed]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: topic_context, reason: reviewed_topic, charged_tool_calls: 5, admission: admitted, status: partial}
      stop_reason: source_unavailable
      status: partial
      implementation_candidates:
        - {cve_id: "CVE-9999-0003", tier: explicit_protocol_mention}
        - {cve_id: "CVE-9999-0004", tier: protocol_component_implementation}
      excluded_implementation_candidates: []
      protocol_context: []
      claims: ["cve:CVE-9999-0003", "cve:CVE-9999-0004"]
      applicability: []
      warning_codes: [topic_pending_review]
      tool_calls: 5
      rounds: 1

  - id: fight_unavailable_protocol
