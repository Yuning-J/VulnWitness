  # An unknown ID beside plain text: the question needs only that CVE, which no search
  # can meet, so the words are not searched.
  - id: unknown_id_residual
    request: {query: "CVE-9999-4242 AUSF resynchronization crash", scope: implementation_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: exact_id
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, refine, needs_open]
        - [refine, validate, no_refinement_available]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: cve_exact_lookup, reason: query_cve_ids, charged_tool_calls: 1, admission: admitted, status: no_match, channels: [exact_id]}
      stop_reason: no_evidence
      status: no_match
      implementation_candidates: []
      excluded_implementation_candidates: []
      protocol_context: []
      claims: []
      applicability: []
      warning_codes: []
      tool_calls: 1
      rounds: 1

