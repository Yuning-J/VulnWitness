      stop_reason: source_unavailable
      status: source_unavailable
      implementation_candidates: []
      excluded_implementation_candidates: ["CVE-9999-0003", "CVE-9999-0004"]
      protocol_context: []
      claims: []
      applicability: []
      warning_codes: [topic_pending_review]
      tool_calls: 5
      rounds: 1

  # The compact alias misses literally, so the one refinement explores the topic.
  - id: impl_5gaka_refines
    request: {query: "5gaka", scope: implementation_only}
    sources: {mitre_fight: packaged}
    expected:
