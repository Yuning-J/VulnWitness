        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, refine, needs_open]
        - [refine, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_found]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: cve_search, reason: query_terms, charged_tool_calls: 1, admission: admitted, status: no_match, channels: [lexical]}
        - {round: 2, tool: topic_context, reason: topic_after_literal_miss, charged_tool_calls: 4, admission: admitted, status: ok}
      stop_reason: sufficient
      status: ok
      implementation_candidates:
