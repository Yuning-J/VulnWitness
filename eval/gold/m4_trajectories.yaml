        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_found]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: cve_exact_lookup, reason: query_cve_ids, charged_tool_calls: 1, admission: admitted, status: ok, channels: [exact_id]}
      stop_reason: sufficient
      status: ok
      implementation_candidates:
        - {cve_id: "CVE-9999-0003", tier: null}
      excluded_implementation_candidates: []
      protocol_context: []
      claims: ["cve:CVE-9999-0003"]
      applicability: []
      warning_codes: []
      tool_calls: 1
      rounds: 1

  - id: cve_under_protocol
    request: {query: "CVE-9999-0003", scope: protocol_context_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: exact_id
      transitions:
        - [interpret, validate, cve_ids_outside_scope]
        - [validate, return, answer_validated]
      steps: []
      stop_reason: policy_blocked
      status: policy_blocked
      implementation_candidates: []
      excluded_implementation_candidates: []
      protocol_context: []
      claims: []
      applicability: []
      warning_codes: []
      tool_calls: 0
      rounds: 0

  - id: protocol_5gaka
    request: {query: "5gaka", scope: protocol_context_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: topic
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_found]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: topic_context, reason: reviewed_topic, charged_tool_calls: 5, admission: admitted, status: ok}
      stop_reason: sufficient
      status: ok
      implementation_candidates: []
      excluded_implementation_candidates: ["CVE-9999-0003", "CVE-9999-0004"]
      protocol_context: ["FGT1499.503", "FGT5040", "FGT5019", "FGT5019.005", "FGT5044"]
      claims:
        - "fight:FGT1499.503"
        - "fight:FGT5019"
        - "fight:FGT5019.005"
        - "fight:FGT5040"
        - "fight:FGT5044"
      applicability: []
      warning_codes: [topic_pending_review]
      tool_calls: 5
      rounds: 1

  # No fixture record names Open5GS, so neither the literal search nor the topic's
  # template searches find one; affectedness is required but unavailable.
  - id: impl_5gaka_open5gs
    request: {query: "5gaka", scope: implementation_only, filters: {products: ["open5gs"]}}
    sources: {mitre_fight: packaged}
    expected:
      intent: topic
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, refine, needs_open]
        - [refine, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, needs_open_after_refinement]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: cve_search, reason: query_terms, charged_tool_calls: 1, admission: admitted, status: no_match, channels: [structured, lexical]}
        - {round: 2, tool: topic_context, reason: topic_after_literal_miss, charged_tool_calls: 4, admission: admitted, status: no_match}
      stop_reason: source_unavailable
      status: partial
      implementation_candidates: []
      excluded_implementation_candidates: []
      protocol_context: []
      claims: []
      applicability:
        - {product: "open5gs", status: unknown}
      warning_codes: [topic_pending_review, applicability_unknown]
      tool_calls: 5
      rounds: 2

