  # A bare ambiguous alias is never searched: it would launder into an unrelated hit.
  - id: bare_aka
    request: {query: "aka", scope: mixed}
    sources: {mitre_fight: packaged}
    expected:
      intent: excluded_terms_only
      transitions:
        - [interpret, validate, excluded_terms_only]
        - [validate, return, answer_validated]
      steps: []
      stop_reason: no_evidence
      status: no_match
      implementation_candidates: []
      excluded_implementation_candidates: []
      protocol_context: []
      claims: []
      applicability: []
      warning_codes: [excluded_term, topic_not_resolved]
      tool_calls: 0
      rounds: 0

  # `cve` and `cves` name the kind of record every result is, so they are never searched:
  # a query of nothing else stops before any call.
  - id: low_signal_only
    request: {query: "CVEs", scope: mixed}
    sources: {mitre_fight: packaged}
    expected:
      intent: unsearchable
      transitions:
        - [interpret, validate, no_searchable_terms]
        - [validate, return, answer_validated]
      steps: []
      stop_reason: no_evidence
      status: no_match
      implementation_candidates: []
      excluded_implementation_candidates: []
      protocol_context: []
      claims: []
      applicability: []
      warning_codes: [topic_not_resolved, no_searchable_terms]
      tool_calls: 0
      rounds: 0

  # `cve`, a stopword and two numbers read as an ID written apart: the numbers are never
  # searched as words, so no record that merely cites CVE-9999-0003 answers for it.
  - id: near_id_after_low_signal_word
    request: {query: "CVE of 9999-0003", scope: mixed}
    sources: {mitre_fight: packaged}
    expected:
      intent: unsearchable
      transitions:
        - [interpret, validate, no_searchable_terms]
        - [validate, return, answer_validated]
      steps: []
      stop_reason: no_evidence
      status: no_match
      implementation_candidates: []
      excluded_implementation_candidates: []
      protocol_context: []
      claims: []
      applicability: []
      warning_codes: [topic_not_resolved, no_searchable_terms]
      tool_calls: 0
      rounds: 0

  # The search reads `ausf resynchronization crash`: searched as a word, `cve` would also
  # match CVE-9999-0007, whose description merely mentions CVEs.
  - id: low_signal_beside_terms
    request: {query: "cve AUSF resynchronization crash", scope: implementation_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: free_text
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_found]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: cve_search, reason: query_terms, charged_tool_calls: 1, admission: admitted, status: ok, channels: [lexical]}
      stop_reason: sufficient
      status: ok
      implementation_candidates:
        - {cve_id: "CVE-9999-0003", tier: null}
      excluded_implementation_candidates: []
      protocol_context: []
      claims: ["cve:CVE-9999-0003"]
      applicability: []
      warning_codes: []
      tool_calls: 1
      rounds: 1

  # CVE-9999-0007's description carries an injected instruction; it is returned as an
  # implementation record with a templated claim and changes nothing else.
  - id: injection_record
    request: {query: "ignore previous instructions", scope: implementation_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: free_text
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_found]
        - [validate, return, answer_validated]
      steps:
