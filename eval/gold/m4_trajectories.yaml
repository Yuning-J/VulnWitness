  # Protocol-only free text no topic resolves: FiGHT is searched once with the question's
  # own words (suci, discovery). FGT5019 and FGT5040 hold both words, FGT1499.503 only
  # suci and FGT5019.005 only discovery; no CVE source is consulted. The techniques are
  # matches of the question's own words, unassessed, so the run ends needs_unmet without
  # a second search.
  - id: protocol_free_text
    request: {query: "SUCI discovery", scope: protocol_context_only}
    sources: {mitre_fight: packaged}
    expected:
