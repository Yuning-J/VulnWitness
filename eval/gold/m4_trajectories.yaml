      rounds: 0

  # The search reads `ausf resynchronization crash`: searched as a word, `cve` would also
  # match CVE-9999-0007, whose description merely mentions CVEs. A search on the question's
  # own words leaves its matches unassessed, and with every word searched no refinement
  # applies, so the run ends with the match listed and the need unmet.
  - id: low_signal_beside_terms
    request: {query: "cve AUSF resynchronization crash", scope: implementation_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: free_text
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, refine, needs_open]
        - [refine, validate, no_refinement_available]
        - [validate, return, answer_validated]
