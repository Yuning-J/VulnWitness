      protocol_context: []
      claims: []
      applicability: []
      warning_codes: []
      tool_calls: 1
      rounds: 1

  - id: unknown_id_zzqx
    request: {query: "CVE-9999-4242 zzqx", scope: mixed}
    sources: {mitre_fight: packaged}
    expected:
      intent: exact_id
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
