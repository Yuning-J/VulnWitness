# Hand-labelled investigation trajectories over the packaged 5G-AKA topic card, the
# FiGHT 3.1.0 excerpt and the synthetic CVE fixture, with the deterministic policy
# m7b.1 and no model planner. Edit only when the labelled truth changes; tests compare
# against this file and never regenerate it.
#
# Each row names the request, which FiGHT source the deployment serves
# (`packaged` excerpt or `unavailable`), and what the run must show: the intent, every
# state transition as [from, to, basis], every tool step, the stop, the answer sections,
# the per-product applicability, the warning codes in emitted order, the backend
# queries charged and the rounds run. A step's `channels`, when given, are the
# retrieval channels its CVE search executed. Implementation candidates carry their
# relevance tier, null when no topic resolved.
trajectories:
  - id: exact_id
    request: {query: "CVE-9999-0003", scope: implementation_only}
    sources: {mitre_fight: packaged}
    expected:
      intent: exact_id
      transitions:
        - [interpret, plan, query_interpreted]
        - [plan, retrieve, plan_accepted]
        - [retrieve, assess, steps_finished]
        - [assess, validate, answer_found]
        - [validate, return, answer_validated]
      steps:
        - {round: 1, tool: cve_exact_lookup, reason: query_cve_ids, charged_tool_calls: 1, admission: admitted, status: ok, channels: [exact_id]}
      stop_reason: sufficient
      status: ok
      implementation_candidates:
        - {cve_id: "CVE-9999-0003", tier: null}
      excluded_implementation_candidates: []
      protocol_context: []
      claims: ["cve:CVE-9999-0003"]
      applicability: []
      warning_codes: []
      tool_calls: 1
      rounds: 1

  - id: exact_id_mixed
    request: {query: "CVE-9999-0003", scope: mixed}
    sources: {mitre_fight: packaged}
    expected:
      intent: exact_id
      transitions:
