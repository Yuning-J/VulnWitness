review:
  status: pending_review
  reviewer: null
  reviewed_on: null
  basis: 'Draft mobile-core topic. GTP-C is control-plane scope: v1 follows TS 29.060 V16.1.0 clauses
    1, 3, 7.3.1; v2 follows TS 29.274 V18.7.0 clauses 1, 3, 4 and 7.2. GTP-U is a separate user-plane
    branch under TS 29.281 V18.2.0 clauses 1, 3, 5, 6.1 and 7.2.1. This card gives broad GTP-family
    retrieval and does not support branch-limited answers. Plane-specific aliases precede bare GTP
    to record the spelling only. matched_alias=GTP-U does not restrict results to GTP-U; GTP-C candidates
    remain eligible. GTPv1 without a plane remains ambiguous between C and U; GTPv2 and gtp2 denote
    control-plane version forms, not GTP-U v2. Observed aliases: GTPv2 in CVE-2015-4275, gtp2 in
    CVE-2026-2517, GTPv1_U in CVE-2026-8187. Network functions and interfaces qualify records only
    and never resolve a question alone. Gn is from TS 29.060 V16.1.0 clause 1; S5, S8, S11, PGW-C
    and SGW-C from TS 29.274 V18.7.0 clauses 4 and 7.2.1; N3 and N9 from TS 29.281 V18.2.0 clauses
    5.2.2.7 and 6.1. Open5GS and mobile-core implementation context are observed in CVE-2026-2517
    and CVE-2026-8187. Code identifiers use space-separated tokenizer forms. The lib/gtp path in
    CVE-2026-2517 is represented by lexical gtp and the specific parser entity: a slash is a hard
    card-term boundary, so lib is not a generic evidence entity. No bare SMF, AMF, UDM, SEAF, TEID
    or PDU is an unqualified term. N4 is not included: its presence does not establish a GTP-handling
    flaw. Bare GTP is also an ecosystem term: this marks its exact alias as needing an independent
    entity or ecosystem qualifier in candidate relevance. A plane or version spelling, GTP message
    or IE, network function or interface, or GTP code identifier confirms telecom context. A product
    name alone does not. GTP iCommerce is a name collision. Wireshark really processes GTP and is
    not blacklisted; its dissectors remain outside the mobile-core endpoint gold scope. The card
    cannot filter retrieval by plane. FiGHT 3.1.0 at commit 097cd5f73811dc34916ef84d5acc3fe7aba70450
    clearly matches FGT1572.501, FGT1572.502, FGT1599.505, FGT5031 and FGT5042. These are reference
    links, not added runtime aliases. No dedicated technique-link field exists in the current contract.
    A named owner must review scope and evidence before approval. Compact CreateSessionRequest and
    CreatePDPContextRequest template terms are card-local renderings of TS 29.274 V18.7.0 clause
    7.2.1 and TS 29.060 V16.1.0 clause 7.3.1. Linux GTP socket, PDP-context, link, transmit and
    receive identifiers qualify bare GTP through their protocol-specific code names, including
    call traces. Generic Linux or kernel product names are not qualifiers. The 5G core phrase
    qualifies the GTP tunnel creation described in CVE-2026-44473; it never selects GTP alone.
    The single-l Tunneling expanded spelling is observed
    in CVE-2017-12217; the double-l canonical form follows the cited specifications.'
