review:
  status: pending_review
  reviewer: null
  reviewed_on: null
  basis: 'Cross-release, whole-protocol, high-recall draft, pending named human review. Exact aliases
    select 5G-AKA. TS 33.501 V19.7.0 clause 6.1.3.2.0 supplies method-specific entities: HRES*/HXRES*
    and 5G HE AV/5G SE AV. Card matching loses the stars, so these names need a second independent
    term. RES*/XRES* lose their distinguishing stars too and stay ecosystem cues. AUSF, UDM, SEAF,
    K_SEAF, SUPI, SUCI, SIDF, authentication messages and service operations are shared authentication
    or identity context, not evidence selecting the method. They stay ecosystem terms and lexical
    retrieval cues; even beside a product they cannot yield protocol_component_implementation. TS
    29.509 V19.5.0 clause 5.2.2.2 defines both 5G-AKA and EAP-AKA'' within Authenticate. Nausf_UEAuthentication_Authenticate,
    Nudm_UEAuthentication_Get, Nausf, UEAuthentication, Nudm_UEAU, Authentication Request and Authentication
    Response therefore never confirm the method. EAP-AKA mentions are not a candidate veto: a record
    involving both methods can still have specific 5G-AKA evidence. Initial identity handling remains
    retrievable as ecosystem context. No contextual AKA alias is licensed. Four bounded template
    searches group protocol, SBI, exchange and identity evidence; templates are lexical queries,
    not conjunctions. Observed spellings come from the CVE references below; normative roles come
    from TS 33.501 clauses 3.1, 5.6, 5.8a, 6.1.2, 6.1.3.2.0, 6.2.2.1 and 6.12.5 and TS 29.509 clauses
    5.2 and 6.1.3.1. The CCS 2018 Tamarin model of TS 33.501 V15.0.0 is formal calibration only.
    Card matching recognizes spaced and compound renderings and ignores nested terms for corroboration.
    The global tokenizer does not split compound tokens or preserve stars. Plain-spaced 5G aka New
    Radio remains indistinguishable from the exact alias. FiGHT receives ecosystem terms as retrieval
    cues too; these do not establish a method-specific vulnerability. Bare 5G and gNB are too broad
    even for this topic context and are omitted. Authentication vector is the shared phrase
    in the 5G HE AV and 5G SE AV definitions of TS 33.501 clause 6.1.3.2.0. It retrieves
    FGT1036.501, whose roaming procedure requests an authentication vector under a spoofed
    PLMN ID. This belongs as authentication threat context shared across methods and generations,
    not as evidence of a 5G-AKA-specific flaw or an alias selecting the method.'
