entities:
- name: HXRES
  role: Tokenizer form of HXRES*, the hash of XRES* used in the 5G-AKA serving-network check; TS
    33.501 V19.7.0 clause 6.1.3.2.0. Requires a second independent card term.
- name: HRES
  role: Tokenizer form of HRES*, compared with HXRES* by the SEAF in 5G-AKA; TS 33.501 V19.7.0 clause
    6.1.3.2.0. Requires a second independent card term.
- name: 5G HE AV
  role: 5G home environment authentication vector for 5G-AKA; TS 33.501 V19.7.0 clause 6.1.3.2.0.
- name: 5G SE AV
  role: 5G serving environment authentication vector for 5G-AKA; TS 33.501 V19.7.0 clause 6.1.3.2.0.
