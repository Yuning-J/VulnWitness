exclusions:
- term: aka
  reason: 'Bare AKA is ambiguous: UMTS and EPS AKA, EAP-AKA and EAP-AKA'', or ''also known as''.
    It names 5G AKA only inside an exact alias.'
- term: EAP-AKA'
  reason: EAP-AKA' is the other 5G primary authentication method (TS 33.501 clause 6.1.3.1), not
    5G AKA. Matching ignores punctuation, so EAP-AKA is excluded too.
- term: EPS AKA
  reason: EPS AKA is the LTE method that 5G AKA enhances (TS 33.501 clause 6.1.3.2.0), not 5G AKA
    itself.
