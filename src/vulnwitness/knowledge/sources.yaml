    terms_verified_on: 2026-10-14
  - name: trustify-software
    official_url: "https://github.com/guacsec/trustify"
    terms_or_license_url: null
    version_strategy: "No compatible Trustify version is verified; no adapter ships (ADR 0003)."
    attribution: null
    redistribution_allowed: unknown
