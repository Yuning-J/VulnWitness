    terms_verified_on: 2026-10-14
    notes: "Explicit ATTACK taxonomy mappings and ChildOf parent chains in fixtures/mitre/weakness-mapping.json; full mappings are operator-supplied. Notice: fixtures/mitre/NOTICE.md."
