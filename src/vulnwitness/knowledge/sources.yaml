# Machine-readable source registry. Terms were read from the official pages on the
# date in terms_verified_on; THIRD_PARTY_DATA.md quotes them. A null
# terms_or_license_url means the terms are unverified: the repository commits no data
# from such a source.
sources:
  - name: nvd
    official_url: "https://nvd.nist.gov"
    terms_or_license_url: "https://nvd.nist.gov/developers/terms-of-use"
    version_strategy: "Per record: NVD lastModified. Per imported feed: sha256 of the decompressed JSON payload, the anchor's source_version (ADR 0008)."
    attribution: "This product uses data from the NVD API but is not endorsed or certified by the NVD."
    redistribution_allowed: allowed_with_conditions
    redistribution_conditions: "NIST publications are public domain (17 USC). Services are asked to show the notice above, must not imply NVD endorsement, and must not attribute modified content to NVD. CVE text inside NVD records is also covered by the CVE terms; how the two interact is unverified."
    local_storage_policy: operator_supplied
    terms_verified_on: 2026-10-14
    artifact_uri_template: "https://nvd.nist.gov/feeds/json/cve/{format}/nvdcve-{format}-{name}.json.gz"
  - name: cve-program
    official_url: "https://www.cve.org"
    terms_or_license_url: "https://www.cve.org/Legal/TermsOfUse"
    version_strategy: "CVE record dateUpdated; CVE List repository commit when mirrored."
    attribution: null
    redistribution_allowed: allowed_with_conditions
    redistribution_conditions: "Copies must reproduce MITRE's copyright designation and the license. The exact wording of the designation is not stated on the terms page (unverified)."
    local_storage_policy: operator_supplied
    terms_verified_on: 2026-10-14
  - name: cisa-kev
    official_url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    terms_or_license_url: "https://www.cisa.gov/sites/default/files/licenses/kev/license.txt"
    version_strategy: "Per imported catalog: sha256 of the CSV file, the KEV anchor's source_version (ADR 0008); the CSV carries no catalogVersion."
    attribution: null
    redistribution_allowed: allowed
    redistribution_conditions: "CC0 1.0. Do not use the CISA logo or DHS seal or imply CISA/DHS endorsement; third-party links in entries keep their own terms."
    local_storage_policy: operator_supplied
    terms_verified_on: 2026-10-14
    artifact_uri_template: "https://www.cisa.gov/sites/default/files/csv/known_exploited_vulnerabilities.csv"
  - name: mitre-fight
    official_url: "https://fight.mitre.org"
    terms_or_license_url: "https://fight.mitre.org/resources/terms/"
    version_strategy: "Git commit of github.com/mitre/FiGHT plus the data version (3.1.0 at 097cd5f7). Each servable file is listed by SHA-256, with its coverage and contents, in knowledge/fight_snapshots.yaml; the operator pins one of those hashes."
    attribution: "© 2023 The MITRE Corporation. This work is reproduced and distributed with the permission of The MITRE Corporation."
    redistribution_allowed: allowed_with_conditions
    redistribution_conditions: "Governed by the FiGHT Terms of Use (copies reproduce MITRE's copyright designation and the licence); ATT&CK-derived entries also by the ATT&CK terms. The repository's Apache-2.0 header covers its software and files, and its 'ALL RIGHTS RESERVED' notices do not revoke the granted licence (M3 review decision, 2026-10-15; not legal advice). The committed excerpt reproduces every MITRE notice (fixtures/fight/NOTICE.md)."
    local_storage_policy: committed_excerpt
    terms_verified_on: 2026-10-14
    notes: "Only a six-technique verbatim excerpt is committed; a full snapshot is operator-supplied."
  - name: mitre-attack
    official_url: "https://attack.mitre.org"
    terms_or_license_url: "https://attack.mitre.org/resources/legal-and-branding/terms-of-use/"
    version_strategy: "Enterprise ATT&CK collection release version (20.0 in the mapping excerpt) and STIX input SHA-256."
    attribution: "© 2026 The MITRE Corporation. This work is reproduced and distributed with the permission of The MITRE Corporation."
    redistribution_allowed: allowed_with_conditions
    redistribution_conditions: "Copies must reproduce MITRE's copyright designation and the license."
    local_storage_policy: committed_excerpt
    terms_verified_on: 2026-10-14
    notes: "FiGHT-derived content and the weakness mapping excerpt (fixtures/mitre/), with source digests and redistribution notices beside each excerpt."
  - name: mitre-cwe
    official_url: "https://cwe.mitre.org"
    terms_or_license_url: "https://cwe.mitre.org/about/termsofuse.html"
    version_strategy: "CWE list version (5.0 in the mapping excerpt) and XML input SHA-256."
    attribution: "Copyright © 2006–2026, The MITRE Corporation. CWE, CWSS, CWRAF, and the CWE logo are trademarks of The MITRE Corporation."
    redistribution_allowed: allowed_with_conditions
    redistribution_conditions: "Copies must reproduce MITRE's copyright designation and the license; the grant says use and copy, not distribute."
    local_storage_policy: committed_excerpt
    terms_verified_on: 2026-10-14
    notes: "Explicit related attack pattern links and marked CWE view 1000 ChildOf inference in fixtures/mitre/weakness-mapping.json; full mappings are operator-supplied. Notice: fixtures/mitre/NOTICE.md."
