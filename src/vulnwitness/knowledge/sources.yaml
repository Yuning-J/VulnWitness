    terms_verified_on: null
  - name: vulnwitness-synthetic-fixture
    official_url: "https://github.com/Yuning-J/vulnwitness"
    terms_or_license_url: "https://github.com/Yuning-J/vulnwitness/blob/main/LICENSE"
