# Reviewed knowledge, not model output: change it only through human review.
topic_schema_version: "1"
topic_id: "3gpp:5g-aka"
version: "1.0.1"
canonical_name: "5G Authentication and Key Agreement"
exact_aliases:
  - "5G-AKA"
  - "5G AKA"
  - "5gaka"
contextual_aliases: []
entities:
  - name: "AUSF"
    role: >-
      Authentication Server Function in the home network. In 5G AKA it computes
      HXRES*, derives K_SEAF from K_AUSF, verifies RES* against XRES*, and on
      success sends K_SEAF (and the SUPI when a SUCI was used) to the SEAF
      (TS 33.501 clauses 5.8a, 6.1.3.2.0).
  - name: "UDM"
    role: >-
      Unified Data Management, with the ARPF. It creates the 5G home environment
      authentication vector, derives K_AUSF, and invokes the SIDF to de-conceal a
      SUCI (TS 33.501 clauses 6.1.2, 6.1.3.2.0).
  - name: "SEAF"
    role: >-
      Security Anchor Function, co-located with the AMF in the serving network. It
      compares HRES* with HXRES* and derives K_AMF from K_SEAF (TS 33.501 clauses
      5.6, 6.1.3.2.0, 6.2.2.1).
  - name: "SUPI"
    role: "Subscription Permanent Identifier of the subscriber (TS 33.501 clause 3.1)."
  - name: "SUCI"
    role: >-
      Subscription Concealed Identifier, a one-time concealed form of the SUPI that
      the SIDF at the UDM de-conceals (TS 33.501 clauses 3.1, 6.12.5).
  - name: "K_SEAF"
    role: >-
      Anchor key derived from K_AUSF, delivered by the AUSF to the SEAF after
      successful authentication (TS 33.501 clauses 6.1.1.1, 6.1.3.2.0).
ecosystem_terms:
  - "5G"
  - "5GC"
  - "5G core"
  - "AMF"
  - "gNB"
  - "NG-RAN"
exclusions:
  - term: "aka"
    reason: >-
      Bare AKA is ambiguous: UMTS and EPS AKA, EAP-AKA and EAP-AKA', or 'also known
      as'. It names 5G AKA only inside an exact alias.
  - term: "EAP-AKA'"
    reason: >-
      EAP-AKA' is the other 5G primary authentication method (TS 33.501 clause
      6.1.3.1), not 5G AKA. Matching ignores punctuation, so EAP-AKA is excluded too.
  - term: "EPS AKA"
    reason: "EPS AKA is the LTE method that 5G AKA enhances (TS 33.501 clause 6.1.3.2.0), not 5G AKA itself."
query_templates:
  - "5G AKA"
  - "5gaka"
  - "AUSF SEAF K_SEAF"
  - "SUCI SUPI UDM"
review:
  status: "pending_review"
  reviewer: null
  reviewed_on: null
  basis: >-
    The rebuild brief specifies the aliases (5G-AKA, 5G AKA, 5gaka), the six
    entities and the bare-aka exclusion. Entity roles, the EAP-AKA' and EPS AKA
    exclusions, ecosystem terms and query templates were drafted by the
    implementer from ETSI TS 133 501 V19.7.0. On 2026-10-15 a technical review
    against that release found no factual error in the roles, aliases, exclusions
    or templates. Scope: this is a cross-release, whole-protocol, high-recall
    topic. It covers 5G AKA with its initial identity handling, so SUPI, SUCI and
    UDM stay entities and the wider identity and subscription threat context they
    match is accepted (30 techniques in full FiGHT 3.1.0; SUPI alone matches 19
    and UDM 17).
    The CCS 2018 Tamarin model (TS 33.501 V15.0.0) also models SUCI, SUPI secrecy
    and the full authentication message flow; it merges AUSF and ARPF into one
    HSS role and omits the AMF field, so it is a formal-calibration reference and
    V19.7.0 stays the normative one. EAP-AKA' and EPS AKA are separate topics.
    There is no contextual alias because AKA beside 5G entities also describes
    EAP-AKA'. Narrowing to the core authentication exchange, or to identity
    privacy, belongs to an investigation profile or a separate topic, not to this
    card. Entity and ecosystem acronyms are ambiguous outside telecom (UDM, AMF,
    5G), so relevance needs two of them; "5G aka New Radio" written with plain
    spaces is indistinguishable from the alias "5G AKA" and is an accepted matcher
    limit. The card stays pending until a named person records the human review.
references:
  - title: "3GPP TS 33.501 Security architecture and procedures for 5G System (ETSI TS 133 501 V19.7.0)"
    uri: "https://www.etsi.org/deliver/etsi_ts/133500_133599/133501/19.07.00_60/ts_133501v190700p.pdf"
    locator: "6.1.3.2 Authentication procedure for 5G AKA"
  - title: "3GPP TS 33.501 Security architecture and procedures for 5G System (ETSI TS 133 501 V19.7.0)"
    uri: "https://www.etsi.org/deliver/etsi_ts/133500_133599/133501/19.07.00_60/ts_133501v190700p.pdf"
    locator: "6.1.3.1 Authentication procedure for EAP-AKA'"
  - title: "Basin et al., A Formal Analysis of 5G Authentication (ACM CCS 2018), Tamarin model of 5G AKA per TS 33.501 V15.0.0"
    uri: "https://github.com/tamarin-prover/tamarin-prover/blob/da8787d5506e2d35bc1c92d7653bf6265fecbddb/examples/ccs18-5G/5G-AKA-nonBindingChannel/5G_AKA.spthy"
    locator: "Theory 5G_aka header: modelled mechanisms and omissions (formal calibration, not normative)"
