[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vulnwitness"
version = "2.0.0.dev0"
description = "An evidence-backed vulnerability investigation workbench for analysts and AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    # Reviewed topic cards and FiGHT snapshots are YAML, read only with a SafeLoader subclass.
    "pyyaml>=6.0.2,<7",
]

[project.urls]
Repository = "https://github.com/Yuning-J/VulnWitness"

[project.optional-dependencies]
semantic = [
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.3,<6",
]
# The MCP server runners; the servers import anyio, and MCP over Streamable HTTP imports
# Starlette and uvicorn (ADR 0007).
mcp = [
    "mcp>=2.3,<3",
    "anyio>=4.9,<5",
    "starlette>=0.48,<2",
    "uvicorn>=0.31.1,<1",
]
# The v2 REST API server: the HTTP guard's ASGI stack, without the MCP SDK (ADR 0007).
api = [
    "anyio>=4.9,<5",
    "starlette>=0.48,<2",
    "uvicorn>=0.31.1,<1",
]
# The legacy-data importer: streaming NVD JSON and bounded CNVD Parquet
# (ADR 0008 §8, ADR 0015 §2).
migration = [
    "ijson>=3.3,<4",
    "pyarrow>=23,<24",
]

[project.entry-points."vulnwitness.adapters"]
semantic = "vulnwitness.adapters.semantic.chroma_retriever:build_semantic_retriever"
mcp_server = "vulnwitness.interfaces.mcp.stdio_runner:serve_stdio"
mcp_http_server = "vulnwitness.interfaces.mcp.http_runner:serve_http"
ui_server = "vulnwitness.interfaces.ui.runner:serve_ui"
api_server = "vulnwitness.interfaces.rest.api_runner:serve_api"
migration_parsers = "vulnwitness.adapters.migration.nvd_feed_reader:build_migration_parsers"
model_planner = "vulnwitness.adapters.planner.openai_compatible:build_model_port"

[project.scripts]
vulnwitness = "vulnwitness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # Contract tests check that the committed schemas accept what the models accept.
    "jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
    # The MCP server and its tests run in the default lane.
    "vulnwitness[mcp]",
    # The importer and its tests run in the default lane.
    "vulnwitness[migration]",
    # The HTTP tests drive the servers through its in-process transport.
    "httpx2>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vulnwitness"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v2" = "vulnwitness/knowledge/schemas/v2"

[tool.hatch.build.targets.sdist]
include = ["/schemas/v2", "/src/vulnwitness", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
# The repository root is on the path so tests import `tests.support`.
pythonpath = ["."]
testpaths = ["tests/unit", "tests/contract", "tests/integration"]
addopts = ["-p", "no:cacheprovider", "--strict-markers"]
# tests/live is outside testpaths; its tests also need VULNWITNESS_LIVE_TESTS=1.
markers = ["live: calls a real model endpoint; opt-in only (tests/live, ADR 0005)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src/vulnwitness"]
strict = true
plugins = ["pydantic.mypy"]

# Optional source parsers ship no type information.
[[tool.mypy.overrides]]
module = ["ijson", "ijson.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
