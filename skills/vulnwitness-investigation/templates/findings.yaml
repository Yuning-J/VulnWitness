# Copy to SESSION_DIR/findings.yaml after recorded product and lookup calls.
# Replace instruction statements, populate selections from the returned pages,
# and replace empty citations with {call: ACTUAL_SEQUENCE, evidence_id: RETURNED_ID}.
# Remove any finding you cannot make. Empty citations supply no resolved evidence.
findings:
  - id: product-observation
    statement: Replace with a narrow observation about a returned product match.
    kind: product_field_match
    status: unconfirmed
    citations: []
  - id: candidate-review
    statement: Explain why the selected CVE merits review and what remains unknown.
    kind: analyst_note
    status: unconfirmed
    citations: []
selections:
  cve_ids: []
  product_queries:
    - vendor: null
      product: null
      version: null
      calls: []
      next_cursor: null
      complete: false
open_questions: []
