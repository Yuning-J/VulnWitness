# The offline lanes (scripts/ci): no services, no secrets, no live tests.
name: offline

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-lane:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python-version }}
      - run: scripts/ci/offline_lane.sh

  core-only-lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.17"
      - run: scripts/ci/core_only_lane.sh 3.12
